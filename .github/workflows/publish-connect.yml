name: Publish @withone/connect to NPM
on:
  release:
    types: [created]
jobs:
  build:
    # Only releases tagged connect-* belong to this package; plain
    # x.y.z tags stay with @withone/auth (publish.yml).
    if: ${{ startsWith(github.event.release.tag_name, 'connect-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --access public
